name: CI

# Host-side checks: nessumctl / factory_program / factory_ui tests against the
# protocol simulator, a shell syntax check of the bring-up script, and a check
# that the committed schematic matches its generator.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tools:
    name: Host tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool tests (against fake_adapter.py)
        working-directory: host/tools
        run: python3 -m unittest -v

      - name: Shell syntax check
        run: sh -n host/linux/check-adapter.sh

      - name: Schematic SVG is up to date with its generator
        run: |
          python3 hardware/gen_schematic.py
          git diff --exit-code hardware/schematic.svg
